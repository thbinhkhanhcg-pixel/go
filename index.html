<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Luyện gõ phím - Lớp 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; margin: 0; background-color: #e5e7eb; }
        
        .ocean-bg { background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 70%, #fde047 70%, #fde047 100%); position: relative; }

        .key {
            display: inline-flex; justify-content: center; align-items: center;
            border-radius: 6px; font-weight: bold; font-size: 0.9rem; color: #333;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2); transition: all 0.05s;
            margin: 2px; user-select: none; border: 1px solid rgba(0,0,0,0.1);
        }
        .key:active, .key.active-typing {
            transform: translateY(4px); box-shadow: 0 0px 0 rgba(0, 0, 0, 0.2); filter: brightness(0.9);
        }

        .c-orange { background-color: #ffa94d; } 
        .c-yellow { background-color: #ffd43b; } 
        .c-blue { background-color: #74c0fc; }   
        .c-green { background-color: #69db7c; }  
        .c-dark { background-color: #495057; color: white; } 

        .bubble {
            position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%;
            animation: float 4s infinite ease-in;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .typing-char {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 40px; height: 60px; margin: 0 2px; transition: all 0.1s;
        }
        .typing-char.current { border: 3px solid #1e293b; border-radius: 4px; color: #000; font-weight: bold; }
        .typing-char.done { color: #9ca3af; }
        .typing-char.waiting { color: #000; }
        
        .typing-char.error {
            border-color: #ef4444; color: #ef4444; background-color: #fee2e2;
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        
        /* Hiệu ứng nhấp nháy cho thông báo nhắc nhập tên */
        .animate-bounce-alert {
            animation: bounceAlert 1s infinite;
        }
        @keyframes bounceAlert {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC3YrmmnBiQm3CeFM83pXua_zkdQ0sC64o",
            authDomain: "typing-practice-650d5.firebaseapp.com",
            projectId: "typing-practice-650d5",
            storageBucket: "typing-practice-650d5.firebasestorage.app",
            messagingSenderId: "873105029860",
            appId: "1:873105029860:web:323a84bf36169c22da0af1"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        auth.signInAnonymously().catch(e => console.error("Lỗi đăng nhập:", e));

        const lessons = [
            { id: 1, title: "Bài 1: Phím cơ sở", text: "a s d f g h j k l ;" },
            { id: 2, title: "Bài 2: Phím trên", text: "q w e r t y u i o p" },
            { id: 3, title: "Bài 3: Phím dưới", text: "z x c v b n m , . /" },
            { id: 4, title: "Bài 4: Tổng hợp", text: "a q z s w x d e c f r v" }
        ];

        // COMPONENT BÀN TAY (Đã phóng to, ngón tay dài hơn, có đổi màu)
        const CuteHand = ({ isLeft, expectedFingerName }) => {
            const cuffColor = isLeft ? "#0ea5e9" : "#f97316";

            const getFill = (fingerName) => {
                const fullTargetName = `${fingerName} tay ${isLeft ? 'trái' : 'phải'}`;
                if (expectedFingerName === fullTargetName) {
                    if (fingerName === 'Ngón út') return '#ffa94d';     // Cam
                    if (fingerName === 'Ngón áp út') return '#ffd43b';  // Vàng
                    if (fingerName === 'Ngón giữa') return '#74c0fc';   // Xanh dương
                    if (fingerName === 'Ngón trỏ') return '#69db7c';    // Xanh lá
                }
                if (expectedFingerName === 'Ngón cái' && fingerName === 'Ngón cái') return '#ffd43b';
                return '#fed7aa'; 
            };

            return (
                // Phóng to kích thước từ width=170 lên 200, height lên 240
                <svg width="200" height="240" viewBox="0 0 100 135" style={{ transform: isLeft ? 'none' : 'scaleX(-1)' }} className="drop-shadow-2xl">
                    {/* Tay áo */}
                    <rect x="25" y="110" width="50" height="20" rx="5" fill={cuffColor} stroke="#1e293b" strokeWidth="3"/>
                    
                    {/* Các ngón tay được kéo dài hơn nhiều so với lòng bàn tay */}
                    <rect x="20" y="40" width="14" height="40" rx="7" fill={getFill('Ngón út')} stroke="#1e293b" strokeWidth="3" style={{transition: 'fill 0.2s'}}/>
                    <rect x="36" y="20" width="14" height="60" rx="7" fill={getFill('Ngón áp út')} stroke="#1e293b" strokeWidth="3" style={{transition: 'fill 0.2s'}}/>
                    <rect x="52" y="10" width="14" height="70" rx="7" fill={getFill('Ngón giữa')} stroke="#1e293b" strokeWidth="3" style={{transition: 'fill 0.2s'}}/>
                    <rect x="68" y="30" width="14" height="50" rx="7" fill={getFill('Ngón trỏ')} stroke="#1e293b" strokeWidth="3" style={{transition: 'fill 0.2s'}}/>
                    
                    {/* Lòng bàn tay lùi xuống dưới */}
                    <rect x="18" y="65" width="66" height="50" rx="15" fill="#fed7aa" stroke="#1e293b" strokeWidth="3"/>
                    
                    {/* Ngón cái */}
                    <path d="M 82 75 Q 98 75 95 90 Q 92 100 80 95" fill={getFill('Ngón cái')} stroke="#1e293b" strokeWidth="3" strokeLinecap="round" style={{transition: 'fill 0.2s'}}/>
                    
                    {/* Xóa viền thừa bên trong lòng bàn tay */}
                    <rect x="21" y="66" width="60" height="46" rx="10" fill="#fed7aa" />
                    <path d="M 80 77 Q 94 77 92 88 Q 90 96 80 92" fill={getFill('Ngón cái')} style={{transition: 'fill 0.2s'}}/>

                    {/* Khuôn mặt */}
                    <circle cx="38" cy="90" r="3" fill="#1e293b"/>
                    <circle cx="62" cy="90" r="3" fill="#1e293b"/>
                    <path d="M 45 95 Q 50 100 55 95" stroke="#1e293b" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                    <circle cx="30" cy="94" r="4" fill="#fca5a5" opacity="0.8"/>
                    <circle cx="70" cy="94" r="4" fill="#fca5a5" opacity="0.8"/>
                </svg>
            );
        };

        const keyboardLayout = [
            [
                { char: '`', class: 'c-orange w-10 h-10' }, { char: '1', class: 'c-orange w-10 h-10' }, { char: '2', class: 'c-yellow w-10 h-10' }, 
                { char: '3', class: 'c-blue w-10 h-10' }, { char: '4', class: 'c-orange w-10 h-10' }, { char: '5', class: 'c-orange w-10 h-10' }, 
                { char: '6', class: 'c-green w-10 h-10' }, { char: '7', class: 'c-green w-10 h-10' }, { char: '8', class: 'c-blue w-10 h-10' }, 
                { char: '9', class: 'c-yellow w-10 h-10' }, { char: '0', class: 'c-orange w-10 h-10' }, { char: '-', class: 'c-orange w-10 h-10' }, 
                { char: '=', class: 'c-orange w-10 h-10' }, { char: 'Backspace', class: 'c-orange w-24 h-10 text-xs' }
            ],
            [
                { char: 'Tab', class: 'c-orange w-16 h-10 text-xs' }, { char: 'q', class: 'c-orange w-10 h-10 uppercase' }, { char: 'w', class: 'c-yellow w-10 h-10 uppercase' }, 
                { char: 'e', class: 'c-blue w-10 h-10 uppercase' }, { char: 'r', class: 'c-orange w-10 h-10 uppercase' }, { char: 't', class: 'c-orange w-10 h-10 uppercase' }, 
                { char: 'y', class: 'c-green w-10 h-10 uppercase' }, { char: 'u', class: 'c-green w-10 h-10 uppercase' }, { char: 'i', class: 'c-blue w-10 h-10 uppercase' }, 
                { char: 'o', class: 'c-yellow w-10 h-10 uppercase' }, { char: 'p', class: 'c-orange w-10 h-10 uppercase' }, { char: '[', class: 'c-orange w-10 h-10' }, 
                { char: ']', class: 'c-orange w-10 h-10' }, { char: '\\', class: 'c-orange w-14 h-10' }
            ],
            [
                { char: 'CapsLock', class: 'c-orange w-20 h-10 text-xs' }, { char: 'a', class: 'c-orange w-10 h-10 uppercase' }, { char: 's', class: 'c-yellow w-10 h-10 uppercase' }, 
                { char: 'd', class: 'c-blue w-10 h-10 uppercase' }, { char: 'f', class: 'c-orange w-10 h-10 uppercase' }, { char: 'g', class: 'c-orange w-10 h-10 uppercase' }, 
                { char: 'h', class: 'c-green w-10 h-10 uppercase' }, { char: 'j', class: 'c-green w-10 h-10 uppercase' }, { char: 'k', class: 'c-blue w-10 h-10 uppercase' }, 
                { char: 'l', class: 'c-yellow w-10 h-10 uppercase' }, { char: ';', class: 'c-orange w-10 h-10' }, { char: "'", class: 'c-orange w-10 h-10' }, 
                { char: 'Enter', class: 'c-orange w-20 h-10 text-xs' }
            ],
            [
                { char: 'Shift', class: 'c-orange w-28 h-10 text-xs' }, { char: 'z', class: 'c-orange w-10 h-10 uppercase' }, { char: 'x', class: 'c-yellow w-10 h-10 uppercase' }, 
                { char: 'c', class: 'c-blue w-10 h-10 uppercase' }, { char: 'v', class: 'c-orange w-10 h-10 uppercase' }, { char: 'b', class: 'c-orange w-10 h-10 uppercase' }, 
                { char: 'n', class: 'c-green w-10 h-10 uppercase' }, { char: 'm', class: 'c-green w-10 h-10 uppercase' }, { char: ',', class: 'c-yellow w-10 h-10' }, 
                { char: '.', class: 'c-orange w-10 h-10' }, { char: '/', class: 'c-orange w-10 h-10' }, { char: 'Shift_R', label: 'Shift', class: 'c-orange w-24 h-10 text-xs' }
            ],
            [
                { char: 'Ctrl', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Win', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Alt', class: 'c-yellow w-12 h-10 text-xs' }, 
                { char: ' ', label: 'SPACE', class: 'c-yellow w-[300px] h-10 text-xs' }, 
                { char: 'AltGr', class: 'c-yellow w-12 h-10 text-xs' }, { char: 'Win_R', label: 'Win', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Menu', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Ctrl_R', label: 'Ctrl', class: 'c-orange w-12 h-10 text-xs' }
            ]
        ];

        const getFingerSuggestion = (char) => {
            if (char === ' ') return { name: "Ngón cái", color: "bg-orange-400", letter: "-" };
            const c = char.toLowerCase();
            const map = {
                'q': 'Ngón út tay trái', 'a': 'Ngón út tay trái', 'z': 'Ngón út tay trái', '1': 'Ngón út tay trái',
                'w': 'Ngón áp út tay trái', 's': 'Ngón áp út tay trái', 'x': 'Ngón áp út tay trái', '2': 'Ngón áp út tay trái',
                'e': 'Ngón giữa tay trái', 'd': 'Ngón giữa tay trái', 'c': 'Ngón giữa tay trái', '3': 'Ngón giữa tay trái',
                'r': 'Ngón trỏ tay trái', 'f': 'Ngón trỏ tay trái', 'v': 'Ngón trỏ tay trái', '4': 'Ngón trỏ tay trái',
                't': 'Ngón trỏ tay trái', 'g': 'Ngón trỏ tay trái', 'b': 'Ngón trỏ tay trái', '5': 'Ngón trỏ tay trái',
                'y': 'Ngón trỏ tay phải', 'h': 'Ngón trỏ tay phải', 'n': 'Ngón trỏ tay phải', '6': 'Ngón trỏ tay phải',
                'u': 'Ngón trỏ tay phải', 'j': 'Ngón trỏ tay phải', 'm': 'Ngón trỏ tay phải', '7': 'Ngón trỏ tay phải',
                'i': 'Ngón giữa tay phải', 'k': 'Ngón giữa tay phải', ',': 'Ngón giữa tay phải', '8': 'Ngón giữa tay phải',
                'o': 'Ngón áp út tay phải', 'l': 'Ngón áp út tay phải', '.': 'Ngón áp út tay phải', '9': 'Ngón áp út tay phải',
                'p': 'Ngón út tay phải', ';': 'Ngón út tay phải', '/': 'Ngón út tay phải', '0': 'Ngón út tay phải'
            };
            const name = map[c] || "Ngón út tay phải";
            return { name, letter: char.toLowerCase() };
        };

        function App() {
            const [playerName, setPlayerName] = React.useState("");
            const [isNameConfirmed, setIsNameConfirmed] = React.useState(false); // Xác nhận đã nhập tên
            const [showNameAlert, setShowNameAlert] = React.useState(false);     // Bật thông báo đỏ

            const [lesson, setLesson] = React.useState(lessons[0]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [errors, setErrors] = React.useState(0);
            const [startTime, setStartTime] = React.useState(null);
            const [isFinished, setIsFinished] = React.useState(false);
            const [showStats, setShowStats] = React.useState(false);
            const [statsData, setStatsData] = React.useState([]);
            const [isTeacherMode, setIsTeacherMode] = React.useState(false);
            const [activeKey, setActiveKey] = React.useState(null); 
            const [accuracy, setAccuracy] = React.useState(100);
            const [hasError, setHasError] = React.useState(false); 

            React.useEffect(() => {
                const unsubscribe = db.collection("stats").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setStatsData(data);
                });
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    if (document.activeElement.tagName === 'INPUT') return;
                    
                    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab', 'Enter', 'Backspace'].includes(e.key)) return;
                    if (isFinished) return;

                    // Yêu cầu học sinh phải nhập tên và nhấn Enter mới được gõ
                    if (!isNameConfirmed || playerName.trim() === "") {
                        setShowNameAlert(true);
                        setTimeout(() => setShowNameAlert(false), 3500); // Ẩn cảnh báo sau 3.5 giây
                        return;
                    }

                    const keyChar = e.key;
                    setActiveKey(keyChar.toLowerCase());

                    const expectedChar = lesson.text[currentIndex];
                    if (currentIndex === 0 && !startTime) setStartTime(Date.now());

                    if (keyChar === expectedChar) {
                        setHasError(false); 
                        if (currentIndex + 1 === lesson.text.length) {
                            setIsFinished(true);
                            const timeTaken = Math.floor((Date.now() - startTime) / 1000);
                            const finalAcc = Math.max(0, 100 - (errors * 5));
                            
                            db.collection("stats").add({
                                playerName, lessonTitle: lesson.title, errors, accuracy: finalAcc, timeTaken,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        } else {
                            setCurrentIndex(currentIndex + 1);
                        }
                    } else {
                        setHasError(true);
                        const newErrors = errors + 1;
                        setErrors(newErrors);
                        setAccuracy(Math.max(0, 100 - (newErrors * 5)));
                    }
                };

                const handleKeyUp = () => setActiveKey(null);
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [currentIndex, isFinished, lesson, errors, startTime, playerName, isNameConfirmed]);

            // Xử lý khi nhập tên xong và nhấn Enter
            const handleNameKeyDown = (e) => {
                if (e.key === 'Enter') {
                    if (e.nativeEvent.isComposing || e.keyCode === 229) return;
                    e.preventDefault();
                    if (playerName.trim() !== "") {
                        setIsNameConfirmed(true);
                        setShowNameAlert(false); // Tắt thông báo nếu đang có
                        e.target.blur();         // Sẵn sàng gõ
                    } else {
                        setShowNameAlert(true);
                    }
                }
            };

            const resetLesson = () => {
                setCurrentIndex(0); setErrors(0); setAccuracy(100); setStartTime(null); setIsFinished(false); setShowStats(false); setHasError(false);
            };

            const handleNextLesson = () => {
                const currentIdx = lessons.findIndex(l => l.id === lesson.id);
                if (currentIdx < lessons.length - 1) {
                    setLesson(lessons[currentIdx + 1]);
                } else {
                    setLesson(lessons[0]); // Nếu hết bài thì quay về bài 1
                }
                resetLesson();
            };

            const formatTime = (seconds) => {
                if (isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const displayedStats = isTeacherMode 
                ? statsData 
                : statsData.filter(stat => stat.playerName.toLowerCase() === playerName.toLowerCase() && playerName.trim() !== "");

            const currentExpectedChar = isFinished ? null : lesson.text[currentIndex];
            const fingerInfo = currentExpectedChar ? getFingerSuggestion(currentExpectedChar) : null;

            return (
                <div className="flex flex-col h-screen overflow-hidden relative">
                    
                    {/* Bảng thông báo yêu cầu nhập tên (Nổi lên giữa màn hình) */}
                    {showNameAlert && (
                        <div className="absolute top-24 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-8 py-4 rounded-xl shadow-2xl font-bold text-xl z-50 animate-bounce-alert border-4 border-red-700">
                            ⚠️ Cảnh báo: Em hãy nhập tên và NHẤN PHÍM ENTER để xác nhận trước khi gõ nhé!
                        </div>
                    )}

                    <div className="bg-[#202124] text-white p-2 flex justify-between items-center shadow-md z-20 h-14">
                        <div className="flex items-center gap-4 h-full">
                            <div className="font-bold text-lg ml-2 flex items-center gap-2">
                                ⏳ TypingPractice
                            </div>
                            <div className={`bg-white rounded px-2 py-1 flex items-center h-8 border-2 ${showNameAlert ? 'border-red-500' : (isNameConfirmed ? 'border-green-500' : 'border-transparent')}`}>
                                <span className="text-gray-500 mr-2 text-sm">👤</span>
                                <input 
                                    type="text" placeholder="Nhập tên của em..." 
                                    value={playerName} 
                                    onChange={(e) => {
                                        setPlayerName(e.target.value);
                                        setIsNameConfirmed(false); // Đổi tên thì phải Enter lại
                                    }} 
                                    onKeyDown={handleNameKeyDown}
                                    className="text-black outline-none border-none bg-transparent w-40 text-sm font-bold"
                                />
                            </div>
                        </div>
                        <div className="flex gap-6 items-center text-sm">
                            <select className="text-black px-2 py-1.5 rounded outline-none" value={lesson.id} onChange={(e) => { setLesson(lessons.find(l => l.id === parseInt(e.target.value))); resetLesson(); }}>
                                {lessons.map(l => <option key={l.id} value={l.id}>{l.title}</option>)}
                            </select>
                            <span className="font-bold text-blue-400">Độ chính xác: {accuracy}%</span>
                            <button onClick={() => setShowStats(true)} className="bg-[#dcfce7] border border-[#22c55e] text-[#166534] px-4 py-1.5 rounded font-bold shadow-sm hover:bg-[#bbf7d0] transition flex items-center gap-2">
                                📊 Thống kê
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 ocean-bg flex flex-col items-center justify-center relative">
                        <div className="bubble w-4 h-4 left-[20%] bottom-[10%]"></div>
                        <div className="bubble w-6 h-6 left-[70%] bottom-[40%] animation-delay-2000"></div>
                        
                        <div className="absolute top-10 left-20 text-6xl opacity-80">☁️</div>
                        <div className="absolute top-16 right-32 text-6xl opacity-80">☁️</div>
                        <div className="absolute bottom-8 right-20 text-5xl z-10">🐳</div>
                        <div className="absolute bottom-6 left-32 text-4xl z-10">🦀</div>

                        <div className="z-10 mt-10">
                            {isFinished ? (
                                <div className="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center gap-6">
                                    <h2 className="text-3xl font-bold text-green-600">🎉 Tuyệt vời! Em đã hoàn thành bài tập!</h2>
                                    <div className="flex gap-4">
                                        <button onClick={resetLesson} className="px-6 py-3 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold rounded-xl shadow transition text-xl flex items-center gap-2">
                                            🔄 Gõ lại bài này
                                        </button>
                                        <button onClick={handleNextLesson} className="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl shadow transition text-xl flex items-center gap-2">
                                            ⏭️ Bài tiếp theo
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-6xl font-mono tracking-[0.2em] flex flex-wrap justify-center px-10">
                                    {lesson.text.split('').map((char, index) => {
                                        let statusClass = "waiting";
                                        if (index < currentIndex) statusClass = "done";
                                        if (index === currentIndex) {
                                            statusClass = hasError ? "current error" : "current";
                                        }
                                        return (
                                            <span key={index} className={`typing-char ${statusClass}`}>
                                                {char === ' ' ? ' ' : char}
                                            </span>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    {!isFinished && fingerInfo && (
                        <div className="w-full bg-white border-t-4 border-yellow-400 p-2 px-8 flex items-center gap-3 z-20 font-bold shadow-sm h-12">
                            <div className="bg-orange-400 w-6 h-6 flex items-center justify-center rounded text-white text-sm shadow-sm">{fingerInfo.letter}</div>
                            <span className="text-gray-800 text-sm">{fingerInfo.name}</span>
                        </div>
                    )}

                    <div className="bg-[#e5e7eb] pb-6 pt-4 flex justify-center z-20 relative border-t border-gray-300">
                        {/* Bàn tay trái - Được đưa vào gần sát bàn phím hơn */}
                        <div className="absolute left-[5%] md:left-[10%] lg:left-[18%] bottom-0 z-30 pointer-events-none">
                            <CuteHand isLeft={true} expectedFingerName={fingerInfo?.name} />
                        </div>

                        <div className="flex flex-col gap-1 z-20">
                            {keyboardLayout.map((row, rowIndex) => (
                                <div key={rowIndex} className="flex gap-1 justify-center">
                                    {row.map((btn, btnIndex) => {
                                        const isPressed = activeKey === btn.char.toLowerCase() || (activeKey === ' ' && btn.char === ' ');
                                        return (
                                            <div key={btnIndex} className={`key ${btn.class} ${isPressed ? 'active-typing' : ''}`}>
                                                {btn.label || btn.char}
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>

                        {/* Bàn tay phải - Được đưa vào gần sát bàn phím hơn */}
                        <div className="absolute right-[5%] md:right-[10%] lg:right-[18%] bottom-0 z-30 pointer-events-none">
                            <CuteHand isLeft={false} expectedFingerName={fingerInfo?.name} />
                        </div>
                    </div>

                    {/* Modal Thống kê - Giữ nguyên không đổi */}
                    {showStats && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-3/4 max-w-4xl flex flex-col max-h-[80vh] overflow-hidden border-2 border-green-500">
                                <div className="bg-white text-green-700 p-4 flex justify-between items-center border-b-2 border-green-100">
                                    <h2 className="text-2xl font-bold flex items-center gap-2">📊 Kết Quả Của Em</h2>
                                    <div className="flex items-center gap-4">
                                        <label className="flex items-center gap-2 cursor-pointer font-medium text-gray-700 bg-gray-100 px-3 py-1.5 rounded-lg text-sm border hover:bg-gray-200">
                                            <input type="checkbox" checked={isTeacherMode} onChange={(e) => setIsTeacherMode(e.target.checked)} className="w-4 h-4 rounded text-green-600" />
                                            Giáo viên
                                        </label>
                                        <button onClick={() => setShowStats(false)} className="text-gray-500 hover:text-red-500 text-3xl font-bold">&times;</button>
                                    </div>
                                </div>
                                <div className="p-4 overflow-y-auto bg-gray-50">
                                    <table className="w-full text-left bg-white rounded-lg shadow-sm border">
                                        <thead className="bg-green-50 text-green-800">
                                            <tr>
                                                <th className="p-3 border-b border-green-100 font-semibold">Thời gian</th>
                                                <th className="p-3 border-b border-green-100 font-semibold">Tên Học Sinh</th>
                                                <th className="p-3 border-b border-green-100 font-semibold">Bài tập</th>
                                                <th className="p-3 border-b border-green-100 font-semibold text-center text-red-600">Số lỗi</th>
                                                <th className="p-3 border-b border-green-100 font-semibold text-center">Chính xác</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {displayedStats.length === 0 ? (
                                                <tr><td colSpan="5" className="p-6 text-center text-gray-500 italic">Chưa có kết quả nào...</td></tr>
                                            ) : (
                                                displayedStats.map(stat => (
                                                    <tr key={stat.id} className="hover:bg-green-50 border-b border-gray-100 transition-colors">
                                                        <td className="p-3 text-gray-600 text-sm">{formatTime(stat.timeTaken)}</td>
                                                        <td className="p-3 font-bold text-blue-600">{stat.playerName}</td>
                                                        <td className="p-3 text-gray-700 text-sm font-medium">{stat.lessonTitle}</td>
                                                        <td className="p-3 text-center font-bold text-red-500">{stat.errors}</td>
                                                        <td className="p-3 text-center font-bold text-green-600">{stat.accuracy}%</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
