        .c-dark { background-color: #495057; color: white; } 
        .bubble {
            position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%;
            animation: float 4s infinite ease-in;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }

        @keyframes float-fish {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .typing-char {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 40px; height: 60px; margin: 0 2px; transition: all 0.1s;
        }

        .typing-char.done { color: rgba(255,255,255,0.5); }
        .typing-char.waiting { color: #000; }
        .typing-char.error {
            border-color: #ef4444; color: #ef4444; background-color: #fee2e2;
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .animate-bounce-alert {
            animation: bounceAlert 1s infinite;
        }
        @keyframes bounceAlert {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }
    </style>
    
    <script>
        const originalError = console.error;
        console.error = function(...args) {
            if(args[0] && typeof args[0] === 'string' && args[0].includes('SyntaxError')) {
                const root = document.getElementById('root');
                if(root) root.innerHTML = '<div style="padding:20px; color:red; background:white; font-size:18px; font-weight:bold; border-bottom:4px solid red; z-index:9999; position:relative;">🚨 LỖI CÚ PHÁP BABEL: ' + args[0] + '</div>';
            }
            originalError.apply(console, args);
        };
    </script>

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ errorInfo: error.toString() });
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-10 text-red-600 bg-white m-10 rounded-xl shadow-2xl border-4 border-red-500 text-center relative z-50">
