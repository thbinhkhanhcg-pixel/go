<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Luyện gõ phím - Lớp 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; margin: 0; }
        
        /* Hình nền đại dương giống bản gốc */
        .ocean-bg {
            background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 70%, #fde047 70%, #fde047 100%);
            position: relative;
        }

        /* Bàn phím 3D */
        .keyboard-base {
            background-color: #d1d5db; /* Xám nhạt */
            border-top: 4px solid #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0px 5px 10px rgba(0,0,0,0.1);
        }

        .key {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #333;
            text-transform: uppercase;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.1s;
            margin: 2px;
            user-select: none;
        }

        .key:active, .key.active-typing {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.2);
            filter: brightness(0.9);
        }

        .key.current-target {
            border: 2px solid #fff;
            animation: pulse-border 1s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 0 0 0px rgba(255,255,255,0.7); }
            70% { box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 0 0 10px rgba(255,255,255,0); }
            100% { box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 0 0 0px rgba(255,255,255,0); }
        }

        /* Màu sắc theo từng ngón tay */
        .c-orange { background-color: #ff9b71; } /* Út trái, Út phải */
        .c-yellow { background-color: #ffd166; } /* Áp út */
        .c-blue { background-color: #4dc0b5; }   /* Giữa */
        .c-green { background-color: #90be6d; }  /* Trỏ 1 */
        .c-lblue { background-color: #64b5f6; }  /* Trỏ phải 2 */
        .c-dark { background-color: #4b5563; color: white; } /* Space, phím phụ */

        /* Bong bóng bay */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: float 4s infinite ease-in;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. CẤU HÌNH FIREBASE CỦA BẠN (Đã tích hợp sẵn)
        const firebaseConfig = {
            apiKey: "AIzaSyC3YrmmnBiQm3CeFM83pXua_zkdQ0sC64o",
            authDomain: "typing-practice-650d5.firebaseapp.com",
            projectId: "typing-practice-650d5",
            storageBucket: "typing-practice-650d5.firebasestorage.app",
            messagingSenderId: "873105029860",
            appId: "1:873105029860:web:323a84bf36169c22da0af1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        auth.signInAnonymously().catch(error => console.error("Lỗi đăng nhập:", error));

        const lessons = [
            { id: 1, title: "Bài 1: Phím cơ sở", text: "a s d f j k l ;" },
            { id: 2, title: "Bài 2: Phím trên", text: "q w e r u i o p" },
            { id: 3, title: "Bài 3: Phím dưới", text: "z x c v m , . /" }
        ];

        // Định nghĩa bàn phím và màu sắc
        const keyboardLayout = [
            [
                { char: '`', class: 'c-orange w-10 h-10' }, { char: '1', class: 'c-orange w-10 h-10' }, { char: '2', class: 'c-yellow w-10 h-10' }, 
                { char: '3', class: 'c-blue w-10 h-10' }, { char: '4', class: 'c-orange w-10 h-10' }, { char: '5', class: 'c-green w-10 h-10' }, 
                { char: '6', class: 'c-green w-10 h-10' }, { char: '7', class: 'c-lblue w-10 h-10' }, { char: '8', class: 'c-yellow w-10 h-10' }, 
                { char: '9', class: 'c-orange w-10 h-10' }, { char: '0', class: 'c-orange w-10 h-10' }, { char: '-', class: 'c-orange w-10 h-10' }, 
                { char: '=', class: 'c-orange w-10 h-10' }, { char: 'Backspace', class: 'c-orange w-24 h-10 text-xs' }
            ],
            [
                { char: 'Tab', class: 'c-orange w-16 h-10 text-xs' }, { char: 'q', class: 'c-orange w-10 h-10' }, { char: 'w', class: 'c-yellow w-10 h-10' }, 
                { char: 'e', class: 'c-blue w-10 h-10' }, { char: 'r', class: 'c-orange w-10 h-10' }, { char: 't', class: 'c-green w-10 h-10' }, 
                { char: 'y', class: 'c-green w-10 h-10' }, { char: 'u', class: 'c-lblue w-10 h-10' }, { char: 'i', class: 'c-yellow w-10 h-10' }, 
                { char: 'o', class: 'c-orange w-10 h-10' }, { char: 'p', class: 'c-orange w-10 h-10' }, { char: '[', class: 'c-orange w-10 h-10' }, 
                { char: ']', class: 'c-orange w-10 h-10' }, { char: '\\', class: 'c-orange w-14 h-10' }
            ],
            [
                { char: 'CapsLock', class: 'c-orange w-20 h-10 text-xs' }, { char: 'a', class: 'c-orange w-10 h-10' }, { char: 's', class: 'c-yellow w-10 h-10' }, 
                { char: 'd', class: 'c-blue w-10 h-10' }, { char: 'f', class: 'c-orange w-10 h-10' }, { char: 'g', class: 'c-green w-10 h-10' }, 
                { char: 'h', class: 'c-green w-10 h-10' }, { char: 'j', class: 'c-lblue w-10 h-10' }, { char: 'k', class: 'c-yellow w-10 h-10' }, 
                { char: 'l', class: 'c-orange w-10 h-10' }, { char: ';', class: 'c-orange w-10 h-10' }, { char: "'", class: 'c-orange w-10 h-10' }, 
                { char: 'Enter', class: 'c-orange w-20 h-10 text-xs' }
            ],
            [
                { char: 'Shift', class: 'c-orange w-28 h-10 text-xs' }, { char: 'z', class: 'c-orange w-10 h-10' }, { char: 'x', class: 'c-yellow w-10 h-10' }, 
                { char: 'c', class: 'c-blue w-10 h-10' }, { char: 'v', class: 'c-orange w-10 h-10' }, { char: 'b', class: 'c-green w-10 h-10' }, 
                { char: 'n', class: 'c-green w-10 h-10' }, { char: 'm', class: 'c-lblue w-10 h-10' }, { char: ',', class: 'c-yellow w-10 h-10' }, 
                { char: '.', class: 'c-orange w-10 h-10' }, { char: '/', class: 'c-orange w-10 h-10' }, { char: 'Shift_R', label: 'Shift', class: 'c-orange w-24 h-10 text-xs' }
            ],
            [
                { char: 'Ctrl', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Win', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Alt', class: 'c-yellow w-12 h-10 text-xs' }, 
                { char: ' ', class: 'c-dark w-[300px] h-10' }, 
                { char: 'AltGr', class: 'c-yellow w-12 h-10 text-xs' }, { char: 'Win_R', label: 'Win', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Menu', class: 'c-orange w-12 h-10 text-xs' }, { char: 'Ctrl_R', label: 'Ctrl', class: 'c-orange w-12 h-10 text-xs' }
            ]
        ];

        // Lấy tên ngón tay để hiển thị gợi ý
        const getFingerSuggestion = (char) => {
            if (char === ' ') return { name: "Ngón cái", color: "bg-gray-600 text-white" };
            const charLower = char.toLowerCase();
            const fingerMap = {
                'q': 'Ngón út tay trái', 'a': 'Ngón út tay trái', 'z': 'Ngón út tay trái', '1': 'Ngón út tay trái',
                'w': 'Ngón áp út tay trái', 's': 'Ngón áp út tay trái', 'x': 'Ngón áp út tay trái', '2': 'Ngón áp út tay trái',
                'e': 'Ngón giữa tay trái', 'd': 'Ngón giữa tay trái', 'c': 'Ngón giữa tay trái', '3': 'Ngón giữa tay trái',
                'r': 'Ngón trỏ tay trái', 'f': 'Ngón trỏ tay trái', 'v': 'Ngón trỏ tay trái', '4': 'Ngón trỏ tay trái',
                't': 'Ngón trỏ tay trái', 'g': 'Ngón trỏ tay trái', 'b': 'Ngón trỏ tay trái', '5': 'Ngón trỏ tay trái',
                'y': 'Ngón trỏ tay phải', 'h': 'Ngón trỏ tay phải', 'n': 'Ngón trỏ tay phải', '6': 'Ngón trỏ tay phải',
                'u': 'Ngón trỏ tay phải', 'j': 'Ngón trỏ tay phải', 'm': 'Ngón trỏ tay phải', '7': 'Ngón trỏ tay phải',
                'i': 'Ngón giữa tay phải', 'k': 'Ngón giữa tay phải', ',': 'Ngón giữa tay phải', '8': 'Ngón giữa tay phải',
                'o': 'Ngón áp út tay phải', 'l': 'Ngón áp út tay phải', '.': 'Ngón áp út tay phải', '9': 'Ngón áp út tay phải',
                'p': 'Ngón út tay phải', ';': 'Ngón út tay phải', '/': 'Ngón út tay phải', '0': 'Ngón út tay phải',
                '-': 'Ngón út tay phải', '=': 'Ngón út tay phải', '[': 'Ngón út tay phải', ']': 'Ngón út tay phải', '\\': 'Ngón út tay phải', "'": 'Ngón út tay phải'
            };
            const name = fingerMap[charLower] || "Không xác định";
            
            let color = "bg-orange-400";
            if (name.includes("áp út")) color = "bg-yellow-400";
            if (name.includes("giữa")) color = "bg-blue-400";
            if (name.includes("trỏ")) color = "bg-green-400";
            
            return { name, color };
        };

        function App() {
            const [playerName, setPlayerName] = React.useState("");
            const [lesson, setLesson] = React.useState(lessons[0]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [errors, setErrors] = React.useState(0);
            const [startTime, setStartTime] = React.useState(null);
            const [isFinished, setIsFinished] = React.useState(false);
            const [showStats, setShowStats] = React.useState(false);
            const [statsData, setStatsData] = React.useState([]);
            const [isTeacherMode, setIsTeacherMode] = React.useState(false);
            const [activeKey, setActiveKey] = React.useState(null); // Lưu phím đang được bấm vật lý

            React.useEffect(() => {
                const unsubscribe = db.collection("stats").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setStatsData(data);
                });
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    if (document.activeElement.tagName === 'INPUT') return;
                    
                    const keyChar = e.key;
                    setActiveKey(keyChar.toLowerCase()); // Hiệu ứng lún phím

                    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab', 'Enter', 'Backspace'].includes(e.key)) return;
                    if (isFinished) return;

                    const expectedChar = lesson.text[currentIndex];
                    if (currentIndex === 0 && !startTime) setStartTime(Date.now());

                    if (keyChar === expectedChar) {
                        if (currentIndex + 1 === lesson.text.length) {
                            setIsFinished(true);
                            const timeTaken = Math.floor((Date.now() - startTime) / 1000);
                            const accuracy = Math.max(0, 100 - (errors * 5));
                            
                            if (playerName.trim() !== "") {
                                db.collection("stats").add({
                                    playerName, lessonTitle: lesson.title, errors, accuracy, timeTaken,
                                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                            setTimeout(() => setShowStats(true), 1000);
                        } else {
                            setCurrentIndex(currentIndex + 1);
                        }
                    } else {
                        setErrors(errors + 1);
                    }
                };

                const handleKeyUp = () => setActiveKey(null);

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [currentIndex, isFinished, lesson, errors, startTime, playerName]);

            const handleNameKeyDown = (e) => {
                if (e.key === 'Enter') {
                    if (e.nativeEvent.isComposing || e.keyCode === 229) return;
                    e.preventDefault();
                    e.target.blur();
                }
            };

            const resetLesson = () => {
                setCurrentIndex(0); setErrors(0); setStartTime(null); setIsFinished(false); setShowStats(false);
            };

            const formatTime = (seconds) => {
                if (isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const displayedStats = isTeacherMode 
                ? statsData 
                : statsData.filter(stat => stat.playerName.toLowerCase() === playerName.toLowerCase() && playerName.trim() !== "");

            const currentExpectedChar = isFinished ? null : lesson.text[currentIndex];
            const fingerInfo = currentExpectedChar ? getFingerSuggestion(currentExpectedChar) : null;

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* Header */}
                    <div className="bg-gray-800 text-white p-2 flex justify-between items-center shadow-md z-20 relative">
                        <div className="flex items-center gap-4">
                            <div className="font-bold text-lg ml-2 flex items-center gap-2">
                                ⌨️ TypingPractice
                            </div>
                            <div className="bg-white rounded px-2 py-1 flex items-center">
                                <span className="text-gray-500 mr-2">👤</span>
                                <input 
                                    type="text" placeholder="Nhập tên..." 
                                    value={playerName} onChange={(e) => setPlayerName(e.target.value)} onKeyDown={handleNameKeyDown}
                                    className="text-black outline-none border-none bg-transparent w-40"
                                />
                            </div>
                        </div>
                        <div className="flex gap-4 items-center">
                            <select className="text-black px-2 py-1 rounded" value={lesson.id} onChange={(e) => { setLesson(lessons.find(l => l.id === parseInt(e.target.value))); resetLesson(); }}>
                                {lessons.map(l => <option key={l.id} value={l.id}>{l.title}</option>)}
                            </select>
                            <span className="font-bold text-blue-300">Lỗi: {errors}</span>
                            <button onClick={() => setShowStats(true)} className="bg-green-500 hover:bg-green-600 px-3 py-1 rounded font-bold shadow">📊 Thống kê</button>
                        </div>
                    </div>

                    {/* Vùng bài tập (Đại dương) */}
                    <div className="flex-1 ocean-bg flex flex-col items-center justify-center relative">
                        <div className="bubble w-4 h-4 left-[20%] bottom-[10%]"></div>
                        <div className="bubble w-8 h-8 left-[30%] bottom-[30%] animation-delay-2000"></div>
                        <div className="absolute top-10 left-20 text-6xl opacity-80">☁️</div>
                        <div className="absolute top-24 right-32 text-6xl opacity-80">☁️</div>
                        <div className="absolute bottom-8 right-20 text-5xl z-10">🐳</div>
                        <div className="absolute bottom-4 left-32 text-4xl z-10">🦀</div>

                        {/* Hộp chữ cần gõ */}
                        <div className="z-10 bg-white p-6 rounded-xl shadow-xl flex gap-2 mb-8 items-center justify-center min-w-[50%] min-h-[120px]">
                            {isFinished ? (
                                <div className="text-2xl font-bold text-green-600 cursor-pointer hover:scale-105 transition" onClick={resetLesson}>
                                    🎉 Tuyệt vời! Em đã hoàn thành bài tập. Bấm vào đây để gõ lại nhé! 🔄
                                </div>
                            ) : (
                                lesson.text.split('').map((char, index) => {
                                    let color = "text-gray-300"; 
                                    let border = "border-transparent";
                                    let extra = "";
                                    
                                    if (index < currentIndex) { color = "text-black"; }
                                    if (index === currentIndex) { 
                                        color = "text-black text-6xl"; 
                                        border = "border-black"; 
                                        extra = "bg-gray-100";
                                    }
                                    
                                    return (
                                        <div key={index} className={`text-5xl font-mono px-2 py-1 border-2 ${border} ${color} ${extra} rounded flex items-center justify-center min-w-[40px] transition-all`}>
                                            {char === ' ' ? '␣' : char}
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Gợi ý ngón tay */}
                    {!isFinished && fingerInfo && (
                        <div className="w-full bg-gray-100 border-t-4 border-yellow-400 p-2 flex items-center gap-3 z-20 font-bold">
                            <div className={`${fingerInfo.color} px-3 py-1 rounded text-white shadow-sm`}>{fingerInfo.name.charAt(0)}</div>
                            <span className="text-gray-700">{fingerInfo.name}</span>
                        </div>
                    )}

                    {/* Vùng Bàn phím */}
                    <div className="bg-gray-200 pb-8 pt-4 flex justify-center z-20">
                        <div className="keyboard-base flex flex-col gap-1">
                            {keyboardLayout.map((row, rowIndex) => (
                                <div key={rowIndex} className="flex gap-1 justify-center">
                                    {row.map((btn, btnIndex) => {
                                        const isExpected = !isFinished && currentExpectedChar && (
                                            btn.char.toLowerCase() === currentExpectedChar.toLowerCase() || 
                                            (currentExpectedChar === ' ' && btn.char === ' ')
                                        );
                                        const isPressed = activeKey === btn.char.toLowerCase() || (activeKey === ' ' && btn.char === ' ');
                                        
                                        return (
                                            <div 
                                                key={btnIndex} 
                                                className={`key ${btn.class} ${isExpected ? 'current-target' : ''} ${isPressed ? 'active-typing' : ''}`}
                                            >
                                                {btn.label || btn.char}
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Modal Thống Kê */}
                    {showStats && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                            <div className="bg-white rounded-lg shadow-2xl w-11/12 max-w-4xl flex flex-col max-h-[85vh]">
                                <div className="bg-green-500 text-white p-4 flex justify-between items-center rounded-t-lg">
                                    <h2 className="text-2xl font-bold flex items-center gap-2">📊 Kết Quả Của Em</h2>
                                    <div className="flex items-center gap-4">
                                        <label className="flex items-center gap-2 cursor-pointer font-medium bg-green-700 px-3 py-1 rounded text-sm hover:bg-green-600 transition">
                                            <input type="checkbox" checked={isTeacherMode} onChange={(e) => setIsTeacherMode(e.target.checked)} className="w-4 h-4 cursor-pointer" />
                                            Chế độ Giáo viên
                                        </label>
                                        <button onClick={() => setShowStats(false)} className="text-white hover:text-gray-200 text-3xl leading-none">&times;</button>
                                    </div>
                                </div>
                                <div className="p-0 overflow-y-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-green-50 sticky top-0 shadow-sm">
                                            <tr>
                                                <th className="p-4 border-b-2 text-green-800">Thời gian</th>
                                                <th className="p-4 border-b-2 text-green-800">Tên Học Sinh</th>
                                                <th className="p-4 border-b-2 text-green-800">Bài tập</th>
                                                <th className="p-4 border-b-2 text-center text-red-600">Số lỗi</th>
                                                <th className="p-4 border-b-2 text-center text-green-700">Chính xác</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {displayedStats.length === 0 ? (
                                                <tr><td colSpan="5" className="p-8 text-center text-gray-500 italic">Chưa có kết quả nào...</td></tr>
                                            ) : (
                                                displayedStats.map(stat => (
                                                    <tr key={stat.id} className="hover:bg-gray-50 border-b">
                                                        <td className="p-4 text-gray-600">{formatTime(stat.timeTaken)}</td>
                                                        <td className="p-4 font-bold text-blue-600 text-lg">{stat.playerName}</td>
                                                        <td className="p-4 font-medium">{stat.lessonTitle}</td>
                                                        <td className="p-4 text-center font-bold text-red-500 text-lg">{stat.errors}</td>
                                                        <td className="p-4 text-center font-bold text-green-600 text-lg">{stat.accuracy}%</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
