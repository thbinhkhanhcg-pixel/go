<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Luyện gõ phím - Lớp 3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; overflow-x: hidden; }
        .key { transition: all 0.1s; }
        .key.active { transform: scale(0.95); filter: brightness(0.9); }
        .finger-glow { animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); } to { filter: drop-shadow(0 0 15px rgba(255,255,0,0.8)); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. CẤU HÌNH FIREBASE CỦA BẠN
        const firebaseConfig = {
            apiKey: "AIzaSyC3YrmmnBiQm3CeFM83pXua_zkdQ0sC64o",
            authDomain: "typing-practice-650d5.firebaseapp.com",
            projectId: "typing-practice-650d5",
            storageBucket: "typing-practice-650d5.firebasestorage.app",
            messagingSenderId: "873105029860",
            appId: "1:873105029860:web:323a84bf36169c22da0af1"
        };

        // Khởi tạo Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Đăng nhập ẩn danh để có quyền ghi dữ liệu
        auth.signInAnonymously().catch(error => console.error("Lỗi đăng nhập:", error));

        // 2. DỮ LIỆU BÀI HỌC
        const lessons = [
            { id: 1, title: "Bài 1: Phím cơ sở", text: "a s d f j k l ;" },
            { id: 2, title: "Bài 2: Phím trên", text: "q w e r u i o p" },
            { id: 3, title: "Bài 3: Phím dưới", text: "z x c v m , . /" }
        ];

        // 3. COMPONENT CHÍNH
        function App() {
            const [playerName, setPlayerName] = React.useState("");
            const [lesson, setLesson] = React.useState(lessons[0]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [errors, setErrors] = React.useState(0);
            const [startTime, setStartTime] = React.useState(null);
            const [isFinished, setIsFinished] = React.useState(false);
            const [showStats, setShowStats] = React.useState(false);
            const [statsData, setStatsData] = React.useState([]);
            const [isTeacherMode, setIsTeacherMode] = React.useState(false);

            // Fetch dữ liệu thống kê từ Firebase
            React.useEffect(() => {
                const unsubscribe = db.collection("stats").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setStatsData(data);
                });
                return () => unsubscribe();
            }, []);

            // Lắng nghe sự kiện gõ phím
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    // Nếu đang nhập tên (thẻ input) thì bỏ qua, không tính là gõ bài
                    if (document.activeElement.tagName === 'INPUT') return;
                    
                    // Bỏ qua các phím điều khiển
                    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab', 'Enter', 'Backspace'].includes(e.key)) return;
                    if (isFinished) return;

                    const expectedChar = lesson.text[currentIndex];
                    const typedChar = e.key;

                    // Bắt đầu tính giờ khi gõ phím đầu tiên
                    if (currentIndex === 0 && !startTime) {
                        setStartTime(Date.now());
                    }

                    if (typedChar === expectedChar) {
                        if (currentIndex + 1 === lesson.text.length) {
                            // Hoàn thành bài
                            setIsFinished(true);
                            const endTime = Date.now();
                            const timeTaken = Math.floor((endTime - startTime) / 1000); // Tính bằng giây
                            const accuracy = Math.max(0, 100 - (errors * 5));

                            // Lưu lên Firebase
                            if (playerName.trim() !== "") {
                                db.collection("stats").add({
                                    playerName: playerName,
                                    lessonTitle: lesson.title,
                                    errors: errors,
                                    accuracy: accuracy,
                                    timeTaken: timeTaken,
                                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                            setShowStats(true);
                        } else {
                            setCurrentIndex(currentIndex + 1);
                        }
                    } else {
                        setErrors(errors + 1);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentIndex, isFinished, lesson, errors, startTime, playerName]);

            // Xử lý khi nhập tên (sửa lỗi gõ tiếng Việt bị nhân đôi chữ)
            const handleNameKeyDown = (e) => {
                if (e.key === 'Enter') {
                    // Nếu bộ gõ tiếng Việt đang hoạt động (đang bỏ dấu), không thoát ra vội
                    if (e.nativeEvent.isComposing || e.keyCode === 229) {
                        return;
                    }
                    e.preventDefault();
                    e.target.blur(); // Thoát khỏi ô nhập để bắt đầu gõ
                }
            };

            const resetLesson = () => {
                setCurrentIndex(0);
                setErrors(0);
                setStartTime(null);
                setIsFinished(false);
                setShowStats(false);
            };

            const formatTime = (seconds) => {
                if (isNaN(seconds)) return "00:00";
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            // Lọc dữ liệu thống kê
            const displayedStats = isTeacherMode 
                ? statsData 
                : statsData.filter(stat => stat.playerName.toLowerCase() === playerName.toLowerCase() && playerName.trim() !== "");

            return (
                <div className="flex flex-col h-screen">
                    {/* Thanh Menu Header */}
                    <div className="bg-gray-800 text-white p-3 flex justify-between items-center shadow-md">
                        <div className="flex items-center gap-4">
                            <span className="font-bold text-xl ml-2">TypingPractice</span>
                            <input 
                                type="text" 
                                placeholder="Nhập tên của em..." 
                                value={playerName}
                                onChange={(e) => setPlayerName(e.target.value)}
                                onKeyDown={handleNameKeyDown}
                                className="px-3 py-1 text-black rounded outline-none border-2 border-transparent focus:border-blue-400"
                            />
                        </div>
                        <div className="flex gap-4 items-center">
                            <select 
                                className="text-black px-2 py-1 rounded outline-none"
                                value={lesson.id}
                                onChange={(e) => {
                                    setLesson(lessons.find(l => l.id === parseInt(e.target.value)));
                                    resetLesson();
                                }}
                            >
                                {lessons.map(l => <option key={l.id} value={l.id}>{l.title}</option>)}
                            </select>
                            <span className="font-bold text-blue-300">Lỗi: {errors}</span>
                            <button onClick={() => setShowStats(true)} className="bg-green-500 hover:bg-green-600 px-4 py-1 rounded font-bold transition">📊 Thống kê</button>
                        </div>
                    </div>

                    {/* Vùng luyện gõ (Màn hình chính) */}
                    <div className="flex-1 bg-blue-400 flex flex-col items-center justify-center relative overflow-hidden">
                        {/* Trang trí hoạt hình */}
                        <div className="absolute top-10 left-10 text-6xl opacity-70">☁️</div>
                        <div className="absolute top-20 right-20 text-6xl opacity-70">☁️</div>
                        <div className="absolute bottom-0 w-full h-12 bg-yellow-200"></div> {/* Bãi cát */}
                        <div className="absolute bottom-8 left-20 text-5xl">🦀</div>
                        <div className="absolute bottom-10 right-32 text-6xl">🐳</div>

                        {/* Chữ cần gõ */}
                        <div className="z-10 bg-white/80 p-8 rounded-2xl shadow-xl border-4 border-white flex gap-2">
                            {lesson.text.split('').map((char, index) => {
                                let color = "text-gray-400"; // Chưa gõ
                                if (index < currentIndex) color = "text-green-500 font-bold"; // Gõ đúng
                                if (index === currentIndex) color = "text-blue-600 border-b-4 border-blue-600 font-bold animate-pulse"; // Đang gõ
                                
                                return (
                                    <span key={index} className={`text-5xl font-mono ${color}`}>
                                        {char === ' ' ? '␣' : char}
                                    </span>
                                );
                            })}
                        </div>
                        
                        {isFinished && (
                            <div className="z-10 mt-6 bg-yellow-400 text-yellow-900 px-6 py-2 rounded-full font-bold text-xl shadow-lg flex items-center gap-2 cursor-pointer hover:scale-105 transition" onClick={resetLesson}>
                                🎉 Chúc mừng em đã hoàn thành! Bấm để gõ lại 🔄
                            </div>
                        )}
                    </div>

                    {/* Bàn phím ảo mô phỏng */}
                    <div className="bg-gray-200 p-6 flex flex-col items-center shadow-inner relative">
                        <div className="flex gap-1 mb-1">
                            {['q','w','e','r','t','y','u','i','o','p'].map(key => (
                                <div key={key} className={`w-12 h-12 flex items-center justify-center rounded text-xl font-bold uppercase shadow-sm ${lesson.text[currentIndex] === key ? 'bg-yellow-300 transform scale-110 shadow-md ring-4 ring-yellow-400 z-10' : 'bg-white'}`}>
                                    {key}
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-1 mb-1 ml-4">
                            {['a','s','d','f','g','h','j','k','l',';'].map(key => (
                                <div key={key} className={`w-12 h-12 flex items-center justify-center rounded text-xl font-bold uppercase shadow-sm ${lesson.text[currentIndex] === key ? 'bg-yellow-300 transform scale-110 shadow-md ring-4 ring-yellow-400 z-10' : 'bg-white'}`}>
                                    {key}
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-1 mb-1 ml-12">
                            {['z','x','c','v','b','n','m',',','.','/'].map(key => (
                                <div key={key} className={`w-12 h-12 flex items-center justify-center rounded text-xl font-bold uppercase shadow-sm ${lesson.text[currentIndex] === key ? 'bg-yellow-300 transform scale-110 shadow-md ring-4 ring-yellow-400 z-10' : 'bg-white'}`}>
                                    {key}
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-1 mt-2">
                            <div className={`w-64 h-12 flex items-center justify-center rounded text-sm font-bold shadow-sm ${lesson.text[currentIndex] === ' ' ? 'bg-yellow-300 ring-4 ring-yellow-400 transform scale-105' : 'bg-white'}`}>
                                SPACE
                            </div>
                        </div>

                        {/* Hình ảnh hai bàn tay (Biểu tượng Emoji đơn giản) */}
                        <div className="absolute left-10 bottom-6 text-7xl opacity-80">✋</div>
                        <div className="absolute right-10 bottom-6 text-7xl opacity-80" style={{transform: "scaleX(-1)"}}>✋</div>
                    </div>

                    {/* Modal Thống Kê */}
                    {showStats && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-3/4 max-w-4xl overflow-hidden flex flex-col max-h-[80vh]">
                                <div className="bg-green-500 text-white p-4 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold">📊 Kết Quả Thực Hành</h2>
                                    <div className="flex items-center gap-4">
                                        <label className="flex items-center gap-2 cursor-pointer font-medium bg-green-600 px-3 py-1 rounded">
                                            <input 
                                                type="checkbox" 
                                                checked={isTeacherMode}
                                                onChange={(e) => setIsTeacherMode(e.target.checked)}
                                                className="w-4 h-4"
                                            />
                                            Góc Giáo viên
                                        </label>
                                        <button onClick={() => setShowStats(false)} className="text-white hover:text-gray-200 text-3xl leading-none">&times;</button>
                                    </div>
                                </div>
                                <div className="p-0 overflow-y-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-gray-100 sticky top-0">
                                            <tr>
                                                <th className="p-3 border-b-2">Tên Học Sinh</th>
                                                <th className="p-3 border-b-2">Bài Tập</th>
                                                <th className="p-3 border-b-2 text-center">Thời Gian (Phút:Giây)</th>
                                                <th className="p-3 border-b-2 text-center text-red-500">Số Lỗi</th>
                                                <th className="p-3 border-b-2 text-center text-green-600">Độ Chính Xác</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {displayedStats.length === 0 ? (
                                                <tr><td colSpan="5" className="p-6 text-center text-gray-500 italic">Chưa có dữ liệu nào...</td></tr>
                                            ) : (
                                                displayedStats.map(stat => (
                                                    <tr key={stat.id} className="hover:bg-gray-50 border-b">
                                                        <td className="p-3 font-bold text-blue-600">{stat.playerName}</td>
                                                        <td className="p-3">{stat.lessonTitle}</td>
                                                        <td className="p-3 text-center">{formatTime(stat.timeTaken)}</td>
                                                        <td className="p-3 text-center font-bold text-red-500">{stat.errors}</td>
                                                        <td className="p-3 text-center font-bold text-green-600">{stat.accuracy}%</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
