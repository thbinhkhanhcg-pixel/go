            transition: all 0.1s; border-radius: 4px;
            min-width: 26px; height: 50px; font-size: 2.8rem; margin: 4px 1px;

            0%, 100% { transform: translateX(0); }

                'Quote': "'", 'BracketLeft': '[', 'BracketRight': ']', 'Backslash': '\\',
                'Minus': '-', 'Equal': '='
            };

            const shiftMap = {
                '1': '!', '2': '@', '3': '#', '4': '$', '5': '%', '6': '^', '7': '&', '8': '*', '9': '(', '0': ')',
                ',': '<', '.': '>', '/': '?', ';': ':', "'": '"', '[': '{', ']': '}', '\\': '|', '-': '_', '=': '+'
            };

            let baseChar = codeMap[code];
            if (!baseChar) return null;

            if (shiftKey) {
                if (/[a-z]/.test(baseChar)) return baseChar.toUpperCase();
                return shiftMap[baseChar] || baseChar;
            }
            return baseChar;
        };

                'i': { finger: 'Ngón giữa tay phải', code: 'KeyI' }, 'k': { finger: 'Ngón giữa tay phải', code: 'KeyK' }, ',': { finger: 'Ngón giữa tay phải', code: 'Comma' }, '8': { finger: 'Ngón giữa tay phải', code: 'Digit8' },
                'o': { finger: 'Ngón áp út tay phải', code: 'KeyO' }, 'l': { finger: 'Ngón áp út tay phải', code: 'KeyL' }, '.': { finger: 'Ngón áp út tay phải', code: 'Period' }, '9': { finger: 'Ngón áp út tay phải', code: 'Digit9' },
                'p': { finger: 'Ngón út tay phải', code: 'KeyP' }, ';': { finger: 'Ngón út tay phải', code: 'Semicolon' }, '/': { finger: 'Ngón út tay phải', code: 'Slash' }, '0': { finger: 'Ngón út tay phải', code: 'Digit0' }
            };
            
            const info = map[normalizedChar] || { finger: "Ngón út tay phải", code: null };
            const name = info.finger;
            
            let shiftName = null;
            if (isUpper) {
                if (name.includes('tay trái')) {
                    shiftName = 'Ngón út tay phải';
                } else {
                    shiftName = 'Ngón út tay trái';
                }
            }

            return { name, letter: normalizedChar, isUpper, shiftName, baseCode: info.code };
        };

        function App() {
            const [playerName, setPlayerName] = React.useState("");
            const [isNameConfirmed, setIsNameConfirmed] = React.useState(false); 
            const [showNameModal, setShowNameModal] = React.useState(false);     
            
            const [lesson, setLesson] = React.useState(lessons[0]);
            const [currentLoop, setCurrentLoop] = React.useState(1);
            
            const [currentIndex, setCurrentIndex] = React.useState(0);
            
            const [errors, setErrors] = React.useState(0);
            const [startTime, setStartTime] = React.useState(null);
            const [isFinished, setIsFinished] = React.useState(false);
            const [showStats, setShowStats] = React.useState(false);
            const [statsData, setStatsData] = React.useState([]);
            const [isTeacherMode, setIsTeacherMode] = React.useState(false);
            
            const [activeCode, setActiveCode] = React.useState(null); 
            const [activeKeyLocation, setActiveKeyLocation] = React.useState(null); 
            
            const [accuracy, setAccuracy] = React.useState(100);
            const [hasError, setHasError] = React.useState(false); 
            
            const [sessionStart] = React.useState(() => Date.now() - 30000); 

            const currentText = (lesson.texts ? lesson.texts[currentLoop - 1] : lesson.text) || "";
            const maxLoops = lesson.texts ? lesson.texts.length : (lesson.loops || 3);

            React.useEffect(() => {
                if (!db) return;
                const unsubscribe = db.collection("stats").orderBy("timestamp", "desc").limit(100).onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => {
                        const docData = doc.data();
                        let timeMs = 0;
                        if (docData.timestamp && typeof docData.timestamp.toMillis === 'function') {
                            timeMs = docData.timestamp.toMillis();
                        }
                        return { id: doc.id, timeMs: timeMs, ...docData };
                    });
                    const currentSessionData = data.filter(item => item.timeMs >= sessionStart);
                    setStatsData(currentSessionData);
                });
                return () => unsubscribe();
            }, [sessionStart]);

            // LẮNG NGHE TRỰC TIẾP TỪ WINDOW ĐỂ CHẶN UNIKEY
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    // Cho phép gõ tên trong ô input
                    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
                    
                    if (!playerName || playerName.trim() === "" || !isNameConfirmed) {
                        setShowNameModal(true);
                        return;
                    }

                    // Bỏ qua các tổ hợp phím hệ thống
                    if (e.ctrlKey || e.altKey || e.metaKey || e.key.startsWith('F')) return;
                    
                    // Chặn hành vi mặc định để chống Unikey giật phím
                    if (e.code.startsWith('Key') || e.code.startsWith('Digit') || ['Space', 'Comma', 'Period', 'Slash', 'Semicolon', 'Quote', 'BracketLeft', 'BracketRight', 'Backslash', 'Minus', 'Equal', 'Backquote'].includes(e.code)) {
                        e.preventDefault(); 
                    }

                    if (isFinished) return;
                    
                    setActiveCode(e.code);
                    setActiveKeyLocation(e.location);

                    const typedChar = getCharFromCode(e.code, e.shiftKey);
                    if (typedChar === null) return; 

                    if (!startTime) setStartTime(Date.now());

                    const expectedChar = currentText[currentIndex];

                    if (typedChar === expectedChar) {
                        setHasError(false); 
                        if (currentIndex + 1 === currentText.length) {
                            if (currentLoop < maxLoops) {
                                setCurrentLoop(prev => prev + 1);
                                setCurrentIndex(0);
                            } else {
                                setIsFinished(true);
                                const timeTaken = Math.floor((Date.now() - startTime) / 1000);
                                const finalAcc = Math.max(0, 100 - (errors * 5));
                                if (db) {
                                    db.collection("stats").add({
                                        playerName: playerName,
                                        lessonTitle: lesson.title,
                                        errors: errors,
                                        accuracy: finalAcc,
                                        timeTaken: timeTaken,
                                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                                    }).catch(err => console.log(err));
                                }
                            }
                        } else {
                            setCurrentIndex(currentIndex + 1);
                        }
                    } else {
                        setHasError(true);
                        setErrors(prev => prev + 1);
                        setAccuracy(prev => Math.max(0, 100 - ((prev + 1) * 5)));
                    }
                };
                
                const handleKeyUp = () => {
                    setActiveCode(null);
                    setActiveKeyLocation(null);
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [currentIndex, isFinished, lesson, errors, startTime, playerName, isNameConfirmed, currentLoop, currentText, maxLoops]);


            const handleNameBlur = () => {
                if (playerName.trim() !== "") {
                    setIsNameConfirmed(true);
                } else {
                    setIsNameConfirmed(false);
                }
            };

            const handleNameKeyDown = (e) => {
                if (e.key === 'Enter') {
                    if (e.nativeEvent && (e.nativeEvent.isComposing || e.keyCode === 229)) return;
                    e.preventDefault();
                    if (playerName && playerName.trim() !== "") {
                        e.target.blur();         
                    } else {
                        setShowNameModal(true);
                    }
                }
            };

            const resetLesson = () => {
                setCurrentIndex(0); 
                setCurrentLoop(1);
                setErrors(0); 
                setAccuracy(100); 
                setStartTime(null); 
                setIsFinished(false); 
                setShowStats(false); 
                setHasError(false);
            };

            const handleNextLesson = () => {
                const currentIdx = lessons.findIndex(l => l.id === lesson.id);
                if (currentIdx < lessons.length - 1) {
                    setLesson(lessons[currentIdx + 1]);
                } else {
                    setLesson(lessons[0]); 
                }
                resetLesson();
            };

            const formatTime = (seconds) => {
                if (isNaN(seconds) || seconds === null) return "00:00";
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };
            
            const clearAllData = async () => {
                if (!db) {
                    alert("Máy chủ đang ngoại tuyến, không thể xóa.");
                    return;
                }
                if (window.confirm("Thầy/Cô có chắc chắn muốn XÓA VĨNH VIỄN toàn bộ lịch sử điểm trên máy chủ không?")) {
                    try {
                        const snapshot = await db.collection("stats").get();
                        const batches = [];
                        let currentBatch = db.batch();
                        let count = 0;
                        snapshot.docs.forEach((doc) => {
                            currentBatch.delete(doc.ref);
                            count++;
                            if (count === 490) {
                                batches.push(currentBatch.commit());
                                currentBatch = db.batch();
                                count = 0;
                            }
                        });
                        if (count > 0) batches.push(currentBatch.commit());
                        await Promise.all(batches);
                        alert("Đã làm sạch toàn bộ dữ liệu thành công!");
                    } catch (error) {
                        alert("Có lỗi xảy ra khi xóa dữ liệu.");
                    }
                }
            };

            const displayedStats = React.useMemo(() => {
                let stats = [...statsData];
                if (isTeacherMode) {
                    return stats.sort((a, b) => {
                        const numA = parseInt((a.lessonTitle || "").match(/Bài (\d+)/i)?.[1] || 999, 10);
                        const numB = parseInt((b.lessonTitle || "").match(/Bài (\d+)/i)?.[1] || 999, 10);
                        if (numA !== numB) return numA - numB;
                        if ((a.accuracy || 0) !== (b.accuracy || 0)) return (b.accuracy || 0) - (a.accuracy || 0);
                        return (a.timeTaken || 0) - (b.timeTaken || 0);
                    });
                } else {
                    return stats.filter(stat => (stat.playerName || "").toLowerCase() === playerName.toLowerCase() && playerName.trim() !== "");
                }
            }, [statsData, isTeacherMode, playerName]);

            const exportToCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
                csvContent += "Thời gian,Tên Học Sinh,Bài tập,Số lỗi,Chính xác\n";

                const statsToExport = isTeacherMode ? displayedStats : statsData.filter(stat => (stat.playerName || "").toLowerCase() === playerName.toLowerCase());

                statsToExport.forEach(stat => {
                    const timeStr = formatTime(stat.timeTaken);
                    const name = `"${stat.playerName || ""}"`;
                    const lesson = `"${stat.lessonTitle || ""}"`;
                    const errors = stat.errors || 0;
                    const acc = `"${stat.accuracy || 0}%"`;
                    csvContent += `${timeStr},${name},${lesson},${errors},${acc}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Thong_Ke_Go_Phim_${new Date().toLocaleDateString('vi-VN').replace(/\//g, '-')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const currentExpectedChar = isFinished ? null : currentText[currentIndex];
            const fingerInfo = currentExpectedChar ? getFingerSuggestion(currentExpectedChar) : null;
            
            return (
                <div className="flex flex-col h-screen overflow-hidden relative">

                    {showNameModal && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60]">
                            <div className="bg-white rounded-3xl shadow-2xl p-8 flex flex-col items-center gap-6 max-w-md w-11/12 animate-pop-in border-4 border-blue-100">
                                <div className="text-6xl">👋</div>
                                <h2 className="text-2xl font-bold text-gray-800 text-center">Chào em, em tên là gì nhỉ?</h2>
                                <input 
                                    type="text" placeholder="Nhập tên của em vào đây nhé..." 
                                    value={playerName} onChange={(e) => setPlayerName(e.target.value)}
                                    onKeyDown={(e) => { 
                                        if (e.key === 'Enter' && playerName.trim() !== '') {
                                            setIsNameConfirmed(true); setShowNameModal(false); document.activeElement?.blur(); 
                                        } 
                                    }}
                                    className="w-full text-xl p-3 border-2 border-blue-400 rounded-xl outline-none focus:border-blue-600 font-bold text-center text-gray-800 shadow-inner" autoFocus
                                />
                                <button 
                                    onClick={() => { if (playerName.trim() !== '') { setIsNameConfirmed(true); setShowNameModal(false); document.activeElement?.blur(); } }}
                                    className={`w-full py-3 rounded-xl font-bold text-xl text-white transition shadow-md flex items-center justify-center gap-2 ${playerName.trim() !== '' ? 'bg-blue-500 hover:bg-blue-600 transform hover:-translate-y-1' : 'bg-gray-400 cursor-not-allowed'}`}
                                    disabled={playerName.trim() === ''}
                                >🚀 Bắt đầu thực hành</button>
                            </div>
                        </div>
                    )}

                    {isOffline ? (
                        <div className="bg-red-600 text-white text-center text-sm py-1 font-bold z-50 relative">
                            ⚠️ Mất kết nối mạng. Học sinh luyện gõ bình thường nhưng điểm không được lưu lên máy chủ.
                        </div>
                    ) : null}

                    <div className="bg-[#202124] text-white p-2 flex justify-between items-center shadow-md z-20 h-14">
                        <div className="flex items-center gap-4 h-full">
                            <div className="font-bold text-lg ml-2 flex items-center gap-2">⌨️ Go</div>
                            <div className={`bg-white rounded px-2 py-1 flex items-center h-8 border-2 ${!isNameConfirmed ? 'border-transparent' : 'border-green-500'} ml-4`}>
                                <span className="text-gray-500 mr-2 text-sm">👤</span>
                                <input 
                                    id="playerNameInput"
                                    type="text" placeholder="Nhập tên của em..." value={playerName} 
                                    onChange={(e) => { setPlayerName(e.target.value); setIsNameConfirmed(false); }} 
                                    onBlur={handleNameBlur}
                                    onKeyDown={handleNameKeyDown}
                                    className="text-black outline-none border-none bg-transparent w-40 text-sm font-bold"
                                />
                            </div>
                        </div>
                        <div className="flex gap-6 items-center text-sm">
                            <select 
                                className="text-black px-2 py-1.5 rounded outline-none font-bold bg-yellow-100" 
                                value={lesson.id} 
                                onChange={(e) => { 
                                    const selected = lessons.find(l => l.id.toString() === e.target.value);
                                    if(selected) { setLesson(selected); resetLesson(); }
                                    e.target.blur(); 
                                }}
                            >
                                {lessons.map(l => <option key={l.id} value={l.id}>{l.title}</option>)}
                            </select>
                            
                            {!isFinished && (
                                <span className="font-bold text-yellow-400 bg-gray-800 px-3 py-1 rounded shadow-inner">
                                    {lesson.id >= 6 ? `Câu số: ${currentLoop}/${maxLoops}` : `Lượt: ${currentLoop}/${maxLoops}`}
                                </span>
                            )}
                            
                            <span className="font-bold text-blue-400">Độ chính xác: {accuracy}%</span>
                            <button onClick={() => setShowStats(true)} className="bg-[#dcfce7] border border-[#22c55e] text-[#166534] px-4 py-1.5 rounded font-bold shadow-sm hover:bg-[#bbf7d0] transition flex items-center gap-2">
                                📊 Thống kê
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 ocean-bg relative">
                        <div className="bubble w-4 h-4 left-[20%] bottom-[10%]"></div>
                        <div className="bubble w-6 h-6 left-[70%] bottom-[40%] animation-delay-2000"></div>
                        <div className="absolute top-10 left-20 text-6xl opacity-80">☁️</div>
                        <div className="absolute top-16 right-32 text-6xl opacity-80">☁️</div>
                        <div className="absolute bottom-2 left-[5%] text-5xl z-10 opacity-90">🪸</div>
                        <div className="absolute bottom-1 left-[15%] text-4xl z-10">🐚</div>
                        <div className="absolute bottom-2 left-32 text-4xl z-10">🦀</div>
                        <div className="absolute bottom-16 left-[25%] text-4xl z-10 fish">🐠</div>
                        <div className="absolute bottom-3 left-[40%] text-5xl z-10 opacity-80">🪸</div>
                        <div className="absolute bottom-8 left-[50%] text-4xl z-10 fish-slow">🐡</div>
                        <div className="absolute bottom-6 right-[35%] text-4xl z-10">🐙</div>
                        <div className="absolute bottom-0 right-[25%] text-6xl z-10 opacity-90">🪸</div>
                        <div className="absolute bottom-20 right-[15%] text-4xl z-10 fish">🐠</div>
                        <div className="absolute bottom-4 right-20 text-5xl z-10">🐳</div>
                        <div className="absolute bottom-2 right-[5%] text-3xl z-10">🐚</div>

                        <div className="absolute top-0 left-0 w-full h-[70%] flex flex-col items-center justify-center z-10">
                            {isFinished ? (
                                <div className="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center gap-6">
                                    <h2 className="text-3xl font-bold text-green-600">🎉 Tuyệt vời! Em đã hoàn thành bài tập!</h2>
                                    <div className="flex gap-4">
                                        <button onClick={resetLesson} className="px-6 py-3 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold rounded-xl shadow transition text-xl flex items-center gap-2">🔄 Gõ lại</button>
                                        <button onClick={handleNextLesson} className="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl shadow transition text-xl flex items-center gap-2">⏭️ Bài tiếp</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="font-mono tracking-widest flex flex-wrap justify-center px-6 w-full lg:px-20">
                                    {currentText.split('').map((char, index) => {
                                        let statusClass = "waiting";
                                        if (index < currentIndex) statusClass = "done";
                                        else if (index === currentIndex) statusClass = hasError ? "current error" : "current";
                                        return <span key={index} className={`typing-char ${statusClass}`}>{char === ' ' ? '\u00A0' : char}</span>;
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    {!isFinished && fingerInfo ? (
                        <div className="w-full bg-white border-t-4 border-yellow-400 p-2 px-8 flex items-center justify-center gap-3 z-20 font-bold shadow-sm h-12">
                            {fingerInfo.isUpper && (
                                <>
                                    <div className="bg-orange-500 px-2 h-6 flex items-center justify-center rounded text-white text-xs shadow-sm">Shift</div>
                                    <span className="text-gray-500 text-sm">+</span>
                                </>
                            )}
                            <div className="bg-orange-400 w-6 h-6 flex items-center justify-center rounded text-white text-sm shadow-sm uppercase">{fingerInfo.letter}</div>
                            <span className="text-gray-800 text-sm">{fingerInfo.name} {fingerInfo.isUpper ? `(Kèm ${fingerInfo.shiftName})` : ''}</span>
                        </div>
                    ) : null}

                    <div className="bg-[#e5e7eb] w-full flex justify-between items-end z-20 relative border-t border-gray-300">
                        <div className="flex-1 flex justify-center pb-2 pointer-events-none hidden md:flex">
                            <CuteHand isLeft={true} expectedFingerName={fingerInfo ? fingerInfo.name : null} expectedShiftFingerName={fingerInfo ? fingerInfo.shiftName : null} />
                        </div>

                        <div className="flex flex-col gap-1 z-20 flex-shrink-0 py-6">
                            {keyboardLayout.map((row, rowIndex) => (
                                <div key={rowIndex} className="flex gap-1 justify-center">
                                    {row.map((btn, btnIndex) => {
                                        const isExpectedBase = !isFinished && fingerInfo && btn.code === fingerInfo.baseCode;
                                        let isExpectedShift = false;
                                        if (!isFinished && fingerInfo && fingerInfo.isUpper) {
                                            if (fingerInfo.shiftName === 'Ngón út tay phải' && btn.code === 'ShiftRight') isExpectedShift = true;
                                            if (fingerInfo.shiftName === 'Ngón út tay trái' && btn.code === 'ShiftLeft') isExpectedShift = true;
                                        }
                                        const isExpected = isExpectedBase || isExpectedShift;
                                        const isPressed = activeCode === btn.code || (activeCode && activeCode.includes('Shift') && btn.code.includes('Shift') && activeCode === btn.code);

                                        const btnClasses = `key ${btn.class} ${isPressed ? 'active-typing' : ''} ${isExpected ? 'target-key' : ''}`;
                                        
                                        return <div key={btnIndex} className={btnClasses}>{btn.label || btn.char}</div>;
                                    })}
                                </div>
                            ))}
                        </div>

                        <div className="flex-1 flex justify-center pb-2 pointer-events-none hidden md:flex">
                            <CuteHand isLeft={false} expectedFingerName={fingerInfo ? fingerInfo.name : null} expectedShiftFingerName={fingerInfo ? fingerInfo.shiftName : null} />
                        </div>
                    </div>

                    {showStats ? (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-11/12 max-w-5xl flex flex-col max-h-[85vh] overflow-hidden border-2 border-green-500">
                                <div className="bg-white text-green-700 p-4 flex justify-between items-center border-b-2 border-green-100">
                                    <h2 className="text-2xl font-bold flex items-center gap-2">📊 Kết Quả Của Em</h2>
                                    <div className="flex items-center gap-4">
                                        <button onClick={exportToCSV} className="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-600 transition flex items-center gap-1">📥 Xuất Excel</button>
                                        {isTeacherMode && !isOffline ? (
                                            <button onClick={clearAllData} className="bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm hover:bg-red-600 transition">🗑️ Làm sạch</button>
                                        ) : null}
                                        <label className="flex items-center gap-2 cursor-pointer font-medium text-gray-700 bg-gray-100 px-3 py-1.5 rounded-lg text-sm border hover:bg-gray-200">
                                            <input type="checkbox" checked={isTeacherMode} onChange={(e) => setIsTeacherMode(e.target.checked)} className="w-4 h-4 rounded text-green-600" />Giáo viên
                                        </label>
                                        <button onClick={() => setShowStats(false)} className="text-gray-500 hover:text-red-500 text-3xl font-bold ml-2">&times;</button>
                                    </div>
                                </div>
                                <div className="p-0 overflow-y-auto bg-gray-50">
                                    <table className="w-full text-left bg-white shadow-sm border-collapse">
                                        <thead className="bg-green-50 text-green-800 sticky top-0 z-10 shadow-sm">
                                            <tr>
                                                <th className="p-4 border-b border-green-200 font-bold">Thời gian</th>
                                                <th className="p-4 border-b border-green-200 font-bold">Tên Học Sinh</th>
                                                <th className="p-4 border-b border-green-200 font-bold">Bài tập</th>
                                                <th className="p-4 border-b border-green-200 font-bold text-center text-red-600">Số lỗi</th>
                                                <th className="p-4 border-b border-green-200 font-bold text-center">Chính xác</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {displayedStats.length === 0 ? (
                                                <tr><td colSpan="5" className="p-6 text-center text-gray-500 italic">Chưa có kết quả nào...</td></tr>
                                            ) : (
                                                displayedStats.map(stat => {
                                                    const acc = stat.accuracy || 0;
                                                    const isNeedsImprovement = acc < 80;
                                                    const rowClass = isNeedsImprovement ? "bg-red-50 hover:bg-red-100 border-b border-red-200" : "hover:bg-green-50 border-b border-gray-100";
                                                        
                                                    return (
                                                        <tr key={stat.id} className={rowClass}>
                                                            <td className="p-4 text-gray-600 text-sm">{formatTime(stat.timeTaken)}</td>
                                                            <td className={`p-4 font-bold text-lg ${isNeedsImprovement ? 'text-red-700' : 'text-blue-600'}`}>{stat.playerName || "Khách"}</td>
                                                            <td className="p-4 text-gray-700 text-sm font-medium">{stat.lessonTitle || ""}</td>
                                                            <td className={`p-4 text-center font-bold text-xl ${isNeedsImprovement ? 'text-red-700' : 'text-red-500'}`}>{stat.errors || 0}</td>
                                                            <td className="p-4 text-center flex flex-col items-center justify-center">
                                                                <span className={`font-bold text-xl ${isNeedsImprovement ? 'text-red-700' : 'text-green-600'}`}>{acc}%</span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
